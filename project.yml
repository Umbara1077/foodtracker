name: ProjectPlate
options:
  bundleIdPrefix: com.projectplate
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "35"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ProjectPlate:
    type: application
    platform: iOS
    sources:
      - path: ProjectPlate
        excludes:
          - "**/*.md"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectplate.app
        PRODUCT_NAME: ProjectPlate
        INFOPLIST_KEY_CFBundleDisplayName: Project Plate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Project Plate uses the camera to photograph meals, scan barcodes, and read nutrition labels.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Project Plate listens so you can quick-add a meal by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Project Plate turns your spoken meal into calories and macros for quick add.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Project Plate reads weight from Apple Health when you enable sync, so Progress can stay up to date.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Project Plate writes meals and weight you log to Apple Health when sync is on.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # Optional managed backend. Leave empty for on-device mock analysis (Simulator / CI).
        INFOPLIST_KEY_PLATE_API_BASE_URL: ""
        INFOPLIST_KEY_PLATE_API_TOKEN: ""
        # Override before TestFlight / App Store — empty falls back to placeholders (in-app legal screens still work).
        INFOPLIST_KEY_PLATE_PRIVACY_POLICY_URL: ""
        INFOPLIST_KEY_PLATE_TERMS_URL: ""
        INFOPLIST_KEY_PLATE_SUPPORT_URL: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ProjectPlate/Resources/ProjectPlate.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: ProjectPlateWidget
        embed: true
        codeSign: false
      - target: ProjectPlateWatch
        embed: true
        codeSign: false
  ProjectPlateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ProjectPlateWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectplate.app.widget
        PRODUCT_NAME: ProjectPlateWidget
        INFOPLIST_FILE: ProjectPlateWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProjectPlateWidget/ProjectPlateWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
  ProjectPlateWatch:
    type: application
    platform: watchOS
    sources:
      - path: ProjectPlateWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectplate.app.watchkitapp
        PRODUCT_NAME: ProjectPlateWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Project Plate
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.projectplate.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CODE_SIGN_ENTITLEMENTS: ProjectPlateWatch/ProjectPlateWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: ""
  ProjectPlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProjectPlateTests
    dependencies:
      - target: ProjectPlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectplate.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ProjectPlate.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ProjectPlate"
        BUNDLE_LOADER: "$(TEST_HOST)"
    hostApplication: ProjectPlate
schemes:
  ProjectPlate:
    build:
      targets:
        ProjectPlate: all
        ProjectPlateWidget: all
        ProjectPlateWatch: all
        ProjectPlateTests: [test]
    run:
      config: Debug
      storeKitConfiguration: ProjectPlate/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: ProjectPlate/Resources/Products.storekit
      targets:
        - ProjectPlateTests
      gatherCoverageData: false
