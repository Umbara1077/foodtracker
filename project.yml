name: ProjectPlate
options:
  bundleIdPrefix: com.projectplate
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ProjectPlate:
    type: application
    platform: iOS
    sources:
      - path: ProjectPlate
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectplate.app
        INFOPLIST_KEY_CFBundleDisplayName: Project Plate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
  ProjectPlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProjectPlateTests
    dependencies:
      - target: ProjectPlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectplate.app.tests
        GENERATE_INFOPLIST_FILE: YES
    hostApplication: ProjectPlate
schemes:
  ProjectPlate:
    build:
      targets:
        ProjectPlate: all
        ProjectPlateTests: [test]
    test:
      targets:
        - ProjectPlateTests
      gatherCoverageData: false
